[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stellarforge-research"
version = "1.16.0"
description = "Multi-survey astronomy research platform: time-domain photometry, official ZTF raw intake, Gaia field-neighbour screens, real ZTF FITS multi-exposure screening, same-exposure Gaia DR3 reference candidates, WCS offset diagnostics, correlated formal Gaia astrometry, annual parallax, held-out Gaia reference image quality diagnostics, per-reference five-parameter formal Gaia parallax/covariance sensitivity, actual ZTF FITS Gaussian-versus-aperture pixel centroid screening, official original science bad-pixel mask flags, native field-center PSF FITS audits, official original ZTF native PSF-fit catalogue Gaia source-candidate screening, actual native spatial DAOPhot lookup-table PSF reconstruction, archived center-FITS checks, original science-image/bitmask WCS-aligned PSF amplitude and sky fitting with descriptive same-image pixel residuals and conservative scientific evidence gates"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ismael Berja Ruiz" }]
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]
science = [
  "numpy>=1.26,<3", "astropy>=6,<8", "astroquery>=0.4.9,<1",
  "pandas>=2.1,<3", "pyarrow>=15,<25", "matplotlib>=3.8,<4",
  "scipy>=1.11,<2",
]
images = ["numpy>=1.26,<3", "scipy>=1.11,<2", "astropy>=6,<8"]
test = ["pytest>=8,<10"]

[project.scripts]
stellarforge = "stellarforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"