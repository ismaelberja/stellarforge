[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellarforge-research"
version = "1.0.0"
description = "Private research software for multi-survey stellar variability and evidence-aware processing"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
