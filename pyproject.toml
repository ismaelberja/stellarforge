[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stellarforge-research"
version = "1.6.0"
description = "Multi-survey astronomy research platform: time-domain photometry, official ZTF raw intake, Gaia field-neighbour screens, bounded FITS image-profile proxies, repeatability, and evidence gates"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Ismael Berja Ruiz" }]
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]
science = [
  "numpy>=1.26,<3", "astropy>=6,<8", "astroquery>=0.4.9,<1",
  "pandas>=2.1,<3", "pyarrow>=15,<25", "matplotlib>=3.8,<4",
  "scipy>=1.11,<2",
]
images = ["numpy>=1.26,<3", "scipy>=1.11,<2", "astropy>=6,<8"]
test = ["pytest>=8,<10"]

[project.scripts]
stellarforge = "stellarforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"