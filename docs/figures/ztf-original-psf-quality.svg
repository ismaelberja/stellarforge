<title id="title">Real original ZTF image pixel-fit quality screens by historical exposure</title>
<desc id="desc">Four original historical ZTF science exposures: FT Tau at MJD 58388.389016 had 2 provisional quality passes and 0 reviews; FT Tau MJD 58491.184780 had 3 passes and 1 review; CIDA 11 MJD 58475.113750 had 5 passes and 0 reviews; CIDA 11 MJD 58849.135984 had 3 passes and 2 reviews. Total 16 source pixel fits, 13 provisional passes and 3 flagged for review. No astrophysical source identification is confirmed.</desc>
