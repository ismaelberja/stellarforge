<title id="title">Taurus catalogue mirror: Gaia DR3 identifier coverage</title>
<desc id="desc">Of 532 Taurus members in the secondary Luhman 2023 catalogue mirror, 467 have Gaia DR3 identifiers and 65 do not. These are catalog membership counts, not physical Gaia-ZTF source matches.</desc>
