<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="r5Title r5Desc">
<title id="r5Title">Original Taurus R5 source denominators: Gaia IDs, survey ObjectIDs and survey epoch measurement rows</title>
<desc id="r5Desc">Three separate denominator panels, not a survival funnel. From 24 frozen Gaia technical source IDs 17 preliminary astrometry quality pass, 7 need review, 22 positional ZTF responses but 0 physical matches. Six original survey ObjectIDs: three returned original DR24 CSV, three provider timeouts, zero physical matches. 684 original per-epoch photometry rows: 591 accepted by the bit15 quality flag and 93 excluded. The source sample is not random and no stellar variability inference is validated.</desc>
<rect width="1100" height="800" rx="12" fill="#fff"/>
<rect width="1100" height="6" fill="#157D85"/>
<text x="35" y="46" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1D3A53">R5 · three source denominators</text>
<text x="35" y="77" font-family="Arial, sans-serif" font-size="15" fill="#60778C">Separate original-source units — never a single attrition funnel or a variability incidence statistic</text>
<g data-panel="1" data-denominator="24"><rect x="30" y="108" width="343" height="560" rx="11" fill="#F3F7FA" stroke="#DCE5EB"/><text x="44" y="144" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1B4358">24 Gaia technical IDs</text><text x="44" y="166" font-family="Arial, sans-serif" font-size="12" fill="#60768B">Original Gaia source labels, NOT 24 ZTF-matched stars</text>
<g data-metric="Published adopted IDs" data-count="24" data-base="24"><text x="44" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">Published adopted IDs</text><text x="356" y="205" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">24/24</text><rect x="44" y="217" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="44" y="217" width="295.000" height="17" rx="5" fill="#32908A"/><text x="44" y="252" font-family="Arial, sans-serif" font-size="12" fill="#627788">24/24 publisher table</text></g>
<g data-metric="Prelim Gaia QC" data-count="17" data-base="24"><text x="44" y="293" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">Prelim Gaia QC</text><text x="356" y="293" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">17/24</text><rect x="44" y="305" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="44" y="305" width="208.958" height="17" rx="5" fill="#32908A"/><text x="44" y="340" font-family="Arial, sans-serif" font-size="12" fill="#627788">17/24 initial astrometry</text></g>
<g data-metric="Astrometry review" data-count="7" data-base="24"><text x="44" y="381" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">Astrometry review</text><text x="356" y="381" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">7/24</text><rect x="44" y="393" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="44" y="393" width="86.042" height="17" rx="5" fill="#D6A04C"/><text x="44" y="428" font-family="Arial, sans-serif" font-size="12" fill="#627788">7/24 not a binary fraction</text></g>
<g data-metric="ZTF positional response" data-count="22" data-base="24"><text x="44" y="469" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">ZTF positional response</text><text x="356" y="469" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">22/24</text><rect x="44" y="481" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="44" y="481" width="270.417" height="17" rx="5" fill="#32908A"/><text x="44" y="516" font-family="Arial, sans-serif" font-size="12" fill="#627788">22/24 not physical match</text></g>
<g data-metric="Physical ZTF matches" data-count="0" data-base="24"><text x="44" y="557" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">Physical ZTF matches</text><text x="356" y="557" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">0/24</text><rect x="44" y="569" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="44" y="569" width="0.000" height="17" rx="5" fill="#BD715D"/><text x="44" y="604" font-family="Arial, sans-serif" font-size="12" fill="#627788">0/24 confirmed identities</text></g>
</g>
<g data-panel="2" data-denominator="6"><rect x="389" y="108" width="343" height="560" rx="11" fill="#F3F7FA" stroke="#DCE5EB"/><text x="403" y="144" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1B4358">6 ZTF survey ObjectIDs</text><text x="403" y="166" font-family="Arial, sans-serif" font-size="12" fill="#60768B">Survey OIDs are not six distinct physical stars</text>
<g data-metric="Original fixed ObjectIDs" data-count="6" data-base="6"><text x="403" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">Original fixed ObjectIDs</text><text x="715" y="205" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">6/6</text><rect x="403" y="217" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="403" y="217" width="295.000" height="17" rx="5" fill="#32908A"/><text x="403" y="252" font-family="Arial, sans-serif" font-size="12" fill="#627788">6 preregistered</text></g>
<g data-metric="DR24 CSV received" data-count="3" data-base="6"><text x="403" y="293" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">DR24 CSV received</text><text x="715" y="293" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">3/6</text><rect x="403" y="305" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="403" y="305" width="147.500" height="17" rx="5" fill="#32908A"/><text x="403" y="340" font-family="Arial, sans-serif" font-size="12" fill="#627788">3/6 original data accessible</text></g>
<g data-metric="Archive timeouts" data-count="3" data-base="6"><text x="403" y="381" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">Archive timeouts</text><text x="715" y="381" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">3/6</text><rect x="403" y="393" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="403" y="393" width="147.500" height="17" rx="5" fill="#D6A04C"/><text x="403" y="428" font-family="Arial, sans-serif" font-size="12" fill="#627788">3/6 unknown, not zero visits</text></g>
<g data-metric="Gaia counterparts" data-count="0" data-base="6"><text x="403" y="469" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">Gaia counterparts</text><text x="715" y="469" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">0/6</text><rect x="403" y="481" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="403" y="481" width="0.000" height="17" rx="5" fill="#BD715D"/><text x="403" y="516" font-family="Arial, sans-serif" font-size="12" fill="#627788">0/6 authenticated</text></g>
</g>
<g data-panel="3" data-denominator="684"><rect x="748" y="108" width="343" height="560" rx="11" fill="#F3F7FA" stroke="#DCE5EB"/><text x="762" y="144" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1B4358">684 survey epoch rows</text><text x="762" y="166" font-family="Arial, sans-serif" font-size="12" fill="#60768B">Photometry observations, not 684 stars</text>
<g data-metric="Original ZTF rows" data-count="684" data-base="684"><text x="762" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">Original ZTF rows</text><text x="1074" y="205" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">684/684</text><rect x="762" y="217" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="762" y="217" width="295.000" height="17" rx="5" fill="#32908A"/><text x="762" y="252" font-family="Arial, sans-serif" font-size="12" fill="#627788">684 actual epoch records</text></g>
<g data-metric="Bit15-QC accepted" data-count="591" data-base="684"><text x="762" y="293" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">Bit15-QC accepted</text><text x="1074" y="293" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">591/684</text><rect x="762" y="305" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="762" y="305" width="254.890" height="17" rx="5" fill="#32908A"/><text x="762" y="340" font-family="Arial, sans-serif" font-size="12" fill="#627788">591/684 probably usable</text></g>
<g data-metric="Bit15-flagged" data-count="93" data-base="684"><text x="762" y="381" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1D465A">Bit15-flagged</text><text x="1074" y="381" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#254E62">93/684</text><rect x="762" y="393" width="295" height="17" rx="5" fill="#E0E8EE"/><rect x="762" y="393" width="40.110" height="17" rx="5" fill="#D6A04C"/><text x="762" y="428" font-family="Arial, sans-serif" font-size="12" fill="#627788">93/684 excluded</text></g>
</g>
<rect x="30" y="693" width="1043" height="85" rx="8" fill="#EAF2F6"/>
<text x="45" y="719" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#284E63">R5 source validation: NOT VERIFIED · methodology review: COMPLETE</text>
<text x="45" y="743" font-family="Arial, sans-serif" font-size="13" fill="#496A7B">0 authenticated Gaia↔ZTF matches means insufficient independent evidence — NOT that the stars are nonvariable.</text>
<text x="45" y="762" font-family="Arial, sans-serif" font-size="12" fill="#637789">Sources: Luhman (2023) author table; original Gaia and IRSA ZTF DR24 R2/R3 source audits; R4 cadence study.</text>
</svg>
