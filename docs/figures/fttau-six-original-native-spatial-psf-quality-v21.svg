  <title id="v21title">FT Tau: six original ZTF native spatial PSF same-source held-out pixel residual screens</title>
  <desc id="v21desc">Derived-only technical values from six exact, previously frozen original ZTF source-image observations. Four of six native spatial DAOPhot same-source checkerboard residual screens passed pre-existing internal QA and two r-band field-609 images require review. The native catalog chi source-quality screen is a separate criterion and its three late-night failures remain failed. These are NOT independent different-star PSF calibration, physical Gaia to ZTF source matches, telescope photographs, or astronomical discoveries. Source: reports/taurus_variability_r2/FTTAU_SIX_ORIGINAL_NATIVE_SPATIAL_DAOPHOT_PSF_NO_RAW.json</desc>
