<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
<title id="title">Original ZTF DR24 source-specific 365-day survey sampling bins: three source curves available, three other source requests timed out</title>
<desc id="desc">Genuine derived-only ZTF original photometric source counts by 365-day bins anchored separately to each ObjectID's own first accepted observation, not common calendar years. Two real source ObjectIDs have two consecutive zero-count bins within their spans, another has eight occupied bins, three further OIDs have unknown sampling due to archival server timeouts. This is not Gaia-identified stellar variability, not real per-observation timestamps and not a periodogram. All source positions and photometry remain private to original archive queries.</desc>
