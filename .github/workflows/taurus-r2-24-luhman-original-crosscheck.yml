name: Taurus R2 — bounded original 2023 Luhman Table 2 provenance

on:
  push:
    branches:
      - research/taurus-r2-24-source-go-no-go
    paths:
      - .github/workflows/taurus-r2-24-luhman-original-crosscheck.yml
      - scripts/run_taurus_r2_publisher_original_crosscheck.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-original-publisher-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install software without extra dependencies
        run: python -m pip install -e .
      - name: Attempt only four bounded original journal/CDS Taurus Table 2 URLs
        run: python -m scripts.run_taurus_r2_publisher_original_crosscheck --output reports/generated/r2_publisher_original_table_no_raw.json
      - name: Upload derived response statuses and hashes only, no original table rows
        uses: actions/upload-artifact@v4
        with:
          name: taurus-r2-original-publisher-source-access-NOT-Gaia-ZTF-identity
          path: reports/generated/r2_publisher_original_table_no_raw.json
          retention-days: 30
          if-no-files-found: error
