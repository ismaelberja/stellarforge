name: Taurus R2 — FT Tau two original ZTF fields and g/r FITS mask PSF checks

on:
  push:
    branches:
      - research/taurus-r2-fttau-two-field-g-r-original-fits
    paths:
      - .github/workflows/taurus-r2-fttau-two-field-original-fits.yml
      - src/stellarforge/r2_ft_tau_two_field_fits.py
      - scripts/run_taurus_r2_ft_tau_two_field_fits.py
      - tests/test_research_taurus_r2_fttau_two_field_fits.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-fttau-four-oid-image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out FT Tau four original ZTF OIDs and predeclared epoch selection
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install science and source-image FITS dependencies
        run: python -m pip install -e '.[test,analysis,images]'
      - name: Verify deterministic date selection and no physical source overclaim contracts
        run: python -m pytest -q tests/test_research_taurus_r2_fttau_two_field_fits.py
      - name: Query four real fixed ZTF OIDs and examine authentic chosen original g/r science FITS masks native PSF catalogs
        run: |
          python -m scripts.run_taurus_r2_ft_tau_two_field_fits --output reports/generated/taurus_r2_fttau_two_field_gr_original_image_derived_no_raw.json
      - name: Upload derived-only no-original-FITS scientific QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taurus-r2-FTTau-four-original-ZTF-OIDs-g-r-two-fields-NO-PHYSICAL-ID
          path: reports/generated/taurus_r2_fttau_two_field_gr_original_image_derived_no_raw.json
          retention-days: 30
          if-no-files-found: warn
