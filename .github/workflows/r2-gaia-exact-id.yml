name: Taurus R2 - original Gaia DR3 exact-source audit (bounded)

on:
  push:
    branches:
      - research/taurus-variability-r2-exact-gaia
    paths:
      - .github/workflows/r2-gaia-exact-id.yml
      - scripts/run_taurus_variability_r2_exact_gaia.py
      - src/stellarforge/r2_gaia_identity.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gaia-exact-id-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout frozen research code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local scientific Python package
        run: python -m pip install -e .
      - name: Query real Gaia DR3 exact source IDs (2 bounded TAP batches, no raw persistence)
        run: |
          python -m scripts.run_taurus_variability_r2_exact_gaia --output reports/generated/r2_gaia_exact_id_no_raw.json
      - name: Upload only derived Gaia status ledger, not original TAP CSV
        uses: actions/upload-artifact@v4
        with:
          name: taurus-r2-exact-gaia-derived-only
          path: reports/generated/r2_gaia_exact_id_no_raw.json
          if-no-files-found: error
          retention-days: 7
