name: Reproduce catalog and synthetic research figures (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific pipeline
        run: python -m pip install -e '.[analysis,test]'
      - name: Run regression suite before generating outputs
        run: python -m pytest -q
      - name: Reproduce catalog-based and synthetic-only figures
        run: |
          python scripts/run_v11_selection_bias.py
          python scripts/plot_technical_seed.py
          python scripts/plot_v09_catalog_motion.py
          python scripts/build_v06_astrometry_audit.py
          python scripts/run_synthetic_event_validation.py
          python scripts/run_v06_systematics_validation.py
          python scripts/run_v07_selection_function.py
      - name: Upload regenerated figures (never push to main)
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-catalog-and-synthetic-figures
          path: |
            reports/*.png
            reports/selection_bias_v1.1/*.png
            reports/observational_gates_v0.9/*.png
            reports/v0.6_catalog_astrometry/*.png
            reports/validation_v0.5/*.png
            reports/validation_v0.6/*.png
            reports/validation_v0.7/*.png
          retention-days: 7
          if-no-files-found: warn
