name: Rebuild research figures from code and pinned catalog

on:
  push:
    paths:
      - '.github/workflows/rebuild-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific pipeline
        run: python -m pip install -e '.[analysis,test]'
      - name: Confirm reproducible code
        run: python -m pytest -q
      - name: Regenerate catalog-based and synthetic-only figures
        run: |
          python scripts/run_v11_selection_bias.py
          python scripts/plot_technical_seed.py
          python scripts/plot_v09_catalog_motion.py
          python scripts/build_v06_astrometry_audit.py
          python scripts/run_synthetic_event_validation.py
          python scripts/run_v06_systematics_validation.py
          python scripts/run_v07_selection_function.py
      - name: Save generated figures and scientific audit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/*.png reports/selection_bias_v1.1/*.png reports/observational_gates_v0.9/*.png reports/v0.6_catalog_astrometry/*.png
          git add -f reports/validation_v0.5/*.png reports/validation_v0.6/*.png reports/validation_v0.7/*.png
          git add reports/selection_bias_v1.1/REPORT.md reports/selection_bias_v1.1/MIRROR_SELECTION_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild transparent catalog and synthetic validation figures"
            git push origin HEAD:main
          fi
