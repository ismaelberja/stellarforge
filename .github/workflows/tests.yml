name: StellarForge scientific and engineering regression suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and scientific dependencies
        run: python -m pip install -e '.[test,analysis]'
      - name: Run all registered research tests (no live network required)
        run: python -m pytest -q
