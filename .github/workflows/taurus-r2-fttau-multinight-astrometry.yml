name: Taurus R2 — FT Tau preregistered original independent-night ZTF native source audit

on:
  push:
    branches:
      - research/taurus-r2-fttau-multinight-native-astrometry
    paths:
      - .github/workflows/taurus-r2-fttau-multinight-astrometry.yml
      - src/stellarforge/r2_fttau_multinight_astrometry.py
      - scripts/run_taurus_r2_fttau_multinight_astrometry.py
      - tests/test_research_r2_fttau_multinight_astrometry.py
      - research/taurus_variability/R2_FTTAU_MULTINIGHT_NATIVE_ASTROMETRY_PREREGISTRATION.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preregistered-ztf-independent-epoch-native-source-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install required scientific libraries and test runner
        run: python -m pip install -e '.[test,analysis,images]'
      - name: Test fixed chronology, exclusion, PSF source quality and no-claim invariants
        run: python -m pytest -q tests/test_research_r2_fttau_multinight_astrometry.py
      - name: Obtain original four OID metadata and inspect at most eight prospectively selected original ZTF native PSF catalogues
        run: python -m scripts.run_taurus_r2_fttau_multinight_astrometry --output reports/generated/r2_fttau_multinight_native_psf_no_raw.json
      - name: Preserve derived-only real-archive outputs, including explicit failed selections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taurus-R2-FTTau-independent-nights-original-ZTF-native-PSF-NO-PHYSICAL-ID
          path: reports/generated/r2_fttau_multinight_native_psf_no_raw.json
          retention-days: 30
          if-no-files-found: warn
