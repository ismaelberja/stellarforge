# Public-repository-safe diagnostics:
# This workflow never uploads raw astronomical CSVs as GitHub artifacts.
name: ZTF live intake diagnostics (ephemeral, no raw artifacts)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-star-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Query preregistered two-position observational pilot
        run: python scripts/ci_observational_pilot.py reports/generated/private_irsa_pilot --fail-if-empty
      - name: Report sanitized science status (never archive raw)
        if: always()
        run: |
          if [ -f reports/generated/private_irsa_pilot/REPORT.md ]; then
            cat reports/generated/private_irsa_pilot/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload provenance-only metadata (NO CSV or images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ztf-transport-status-no-raw
          path: |
            reports/generated/private_irsa_pilot/PILOT_STATUS.json
            reports/generated/private_irsa_pilot/REPORT.md
          retention-days: 7
          if-no-files-found: warn
