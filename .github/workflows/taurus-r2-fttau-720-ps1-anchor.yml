name: Taurus R2 — independent 720arcsec FT Tau original field ensemble and ZTF PS1 FITS metadata

on:
  push:
    branches:
      - research/taurus-r2-fttau-expanded-720-ps1-anchor
    paths:
      - .github/workflows/taurus-r2-fttau-720-ps1-anchor.yml
      - src/stellarforge/r2_fttau_crossfield_instrumental_ensemble.py
      - src/stellarforge/r2_fttau_720_ps1_anchor.py
      - scripts/run_taurus_r2_fttau_720_ps1_anchor.py
      - tests/test_research_taurus_r2_fttau_720_ps1_anchor.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-FTTau-frozen-four-psfcats-and-PS1-header:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out immutable old 360 negative study and newly preregistered 720 science method
        uses: actions/checkout@v4
      - name: Use science Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible Gaia / FITS / original ZTF science dependencies
        run: python -m pip install -e '.[test,analysis,images]'
      - name: Verify unchanged old protocol, new geometry, synthetic header/fail-closed science tests
        run: |
          python -m pytest -q tests/test_research_taurus_r2_fttau_720_ps1_anchor.py tests/test_research_r2_fttau_crossfield_instrumental_ensemble.py
      - name: Read four original SHA-fixed ZTF PSF catalogs and four matching science FITS headers
        run: |
          python -m scripts.run_taurus_r2_fttau_720_ps1_anchor --output reports/generated/r2_fttau_720_ztf_native_and_pipeline_PS1_header_no_raw.json
      - name: Upload derived-only 720arcsec native instrumental reference and ZTF pipeline PS1-anchor comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taurus-r2-FTTau-720arcsec-original-four-PSFcat-ZTF-PS1header-NO-RAW
          path: reports/generated/r2_fttau_720_ztf_native_and_pipeline_PS1_header_no_raw.json
          retention-days: 30
          if-no-files-found: warn
