# First observed-data reconstruction/official center-FITS validation; manual-only after.
name: v1.15 Original DAOPhot spatial PSF reconstruction/center FITS QA (NO RAW)

on:
  push:
    paths:
      - '.github/workflows/v115-original-spatial-psf.yml'
  workflow_dispatch:
    inputs:
      acquisition_run_id:
        description: "Historical original SHA-verified ZTF IRSA acquisition run"
        required: true
        type: string
        default: "41997079598"

permissions:
  contents: read
  actions: read

jobs:
  spatial-native-psf-original:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific FITS/DAOPhot PSF and test dependencies
        run: python -m pip install -e '.[test,analysis,images]'
      - name: Run all regressions including malformed spatial lookup and synthetic center FITS tests
        run: python -m pytest -q
      - name: Retrieve manifested official two-target ZTF original photometry ONLY in ephemeral runner
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          SOURCE_RUN: "${{ inputs.acquisition_run_id || '41997079598' }}"
        run: |
          mkdir -p "$RUNNER_TEMP/v115_original_irsa"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name taurus-two-target-raw-UNVERIFIED \
            --dir "$RUNNER_TEMP/v115_original_irsa"
      - name: Validate historical source inventory, construct scratch-only source ZIP
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          source=Path(os.environ["RUNNER_TEMP"])/"v115_original_irsa"
          files=sorted(p for p in source.iterdir() if p.is_file())
          expected={"PILOT_STATUS.json","REPORT.md",
                    "149623711269425408_IRSA_RAW.csv",
                    "3419110734340795648_IRSA_RAW.csv"}
          if {p.name for p in files}!=expected:
              raise ValueError("Historical ZTF official source artifact inventory changed")
          with ZipFile(source.parent/"v115_original_irsa.zip","w",ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.name)
          PY
      - name: Decode native DAOPhot spatial PSFs at actual source coords and compare actual original center FITS
        run: |
          python scripts/run_v115_spatial_psf_original.py \
            "$RUNNER_TEMP/v115_original_irsa.zip" \
            --seed data/research_seed/TAURUS_24_PROVISIONAL_GAIA_POSITIONS.csv \
            --ledger data/research_seed/V18_DERIVED_REFERENCE_OFFSETS_NO_RAW.json \
            --gaia-timeout 25 --archive-timeout 12 \
            --output reports/generated/v1.15_spatial_psf \
            --require-some-daophot
      - name: Show real original source-model consistency and independent-calibration caveats
        if: always()
        run: |
          if [ -f reports/generated/v1.15_spatial_psf/V115_DAOPHOT_SPATIAL_PSF_CENTER_QA_NO_RAW.md ]; then
            cat reports/generated/v1.15_spatial_psf/V115_DAOPHOT_SPATIAL_PSF_CENTER_QA_NO_RAW.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload only derived model shape, source hash, center similarity and statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v115-original-ZTF-spatial-DAOPhot-PSF-center-check-NO-RAW
          path: |
            reports/generated/v1.15_spatial_psf/V115_DAOPHOT_SPATIAL_PSF_CENTER_QA_NO_RAW.json
            reports/generated/v1.15_spatial_psf/V115_DAOPHOT_SPATIAL_PSF_CENTER_QA_NO_RAW.md
          retention-days: 7
          if-no-files-found: warn
