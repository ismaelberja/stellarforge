name: Taurus R2 — authentic six frozen FT Tau ZTF science-pixel independent Gaussian residuals

on:
  push:
    branches:
      - research/taurus-r2-fttau-independent-science-pixel-residual
    paths:
      - .github/workflows/taurus-r2-fttau-six-original-independent-pixels.yml
      - src/stellarforge/r2_fttau_six_independent_pixel_residuals.py
      - scripts/run_taurus_r2_fttau_six_independent_pixel_residuals.py
      - tests/test_research_r2_fttau_six_independent_pixel_residuals.py
      - research/taurus_variability/R2_FTTAU_SIX_EPOCH_INDEPENDENT_GAUSSIAN_PIXELS_PREREGISTRATION.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authentic-six-frozen-original-ztf-pixel-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FITS, WCS, robust numerical pixel fitting and tests
        run: python -m pip install -e '.[test,analysis,images]'
      - name: Test frozen exact source SHA and independently controlled pixel-fitting science boundaries
        run: python -m pytest -q tests/test_research_r2_fttau_six_independent_pixel_residuals.py
      - name: Retrieve six original dated native PSF/source and FITS science/mask; save only derived analytic residuals
        run: python -m scripts.run_taurus_r2_fttau_six_independent_pixel_residuals --output reports/generated/r2_fttau_six_original_independent_gaussian_pixels_no_raw.json
      - name: Archive only derived original-date masked-pixel residual QA and original SHA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taurus-R2-FTTau-six-original-PSF-SCIENCE-MASK-independent-Gaussian-PIXELQA-NO-ID
          path: reports/generated/r2_fttau_six_original_independent_gaussian_pixels_no_raw.json
          retention-days: 30
          if-no-files-found: warn
